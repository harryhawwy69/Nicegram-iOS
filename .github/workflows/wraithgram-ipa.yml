name: Wraithgram IPA

on:
  push:
    branches:
      - feat/lean-ios-client
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wraithgram-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.WRAITHGRAM_APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.WRAITHGRAM_APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_CONTENT: ${{ secrets.WRAITHGRAM_APP_STORE_CONNECT_API_PRIVATE_KEY_CONTENT }}
      BAZEL_LOCAL_CACHE: /Users/runner/work/wraithgram-bazel-cache
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_wraithgram
      BUILD_WORKING_DIR: /Users/wraithgram/build-working-dir
      BUNDLE_ID: app.wraithgram
      KEYCHAIN_NAME: wraithgram-build
      KEYCHAIN_PASSWORD: ${{ secrets.WRAITHGRAM_KEYCHAIN_PASSWORD }}
      MATCH_PASSWORD: ${{ secrets.WRAITHGRAM_CODESIGN_PASSWORD }}
      SIGN_URL: ${{ secrets.WRAITHGRAM_CODESIGN_REPOSITORY }}
      SOURCE_PATH: /Users/wraithgram/source
      TEAM_ID: ${{ secrets.WRAITHGRAM_TEAM_ID }}
      TELEGRAM_CODESIGNING_GIT_PASSWORD: ${{ secrets.WRAITHGRAM_CODESIGN_PASSWORD }}
      TELEGRAM_CODESIGNING_PRIVATE_KEY: ${{ secrets.WRAITHGRAM_BITBUCKET_SSH_KEY }}
      TELEGRAM_CONFIGURATION_PROD: ${{ secrets.WRAITHGRAM_TELEGRAM_CONFIGURATION_PROD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Restore Bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BAZEL_LOCAL_CACHE }}
            ${{ env.BAZEL_USER_ROOT }}/cache
          key: ${{ runner.os }}-${{ runner.arch }}-wraithgram-bazel-${{ hashFiles('versions.json', 'MODULE.bazel', 'Package.resolved', 'ci/nicegram.bazelrc', 'ci/fastlane/Fastfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-wraithgram-bazel-

      - name: Validate private build inputs
        env:
          WRAITHGRAM_BITBUCKET_SSH_KEY: ${{ secrets.WRAITHGRAM_BITBUCKET_SSH_KEY }}
        run: |
          missing=0
          for name in \
            WRAITHGRAM_BITBUCKET_SSH_KEY \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_KEY_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY_CONTENT \
            KEYCHAIN_PASSWORD \
            MATCH_PASSWORD \
            SIGN_URL \
            TEAM_ID \
            TELEGRAM_CONFIGURATION_PROD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is required for a signed Wraithgram IPA."
              missing=1
            fi
          done
          exit "$missing"

      - name: Initialize source submodules
        env:
          WRAITHGRAM_BITBUCKET_SSH_KEY: ${{ secrets.WRAITHGRAM_BITBUCKET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$WRAITHGRAM_BITBUCKET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts
          git submodule update --init --recursive --depth 1

      - name: Select required Xcode
        run: |
          xcode_version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/wraithgram
          sudo chown -R "$(whoami)" /Users/wraithgram
          rm -rf "$SOURCE_PATH"
          cp -R "$GITHUB_WORKSPACE" "$SOURCE_PATH"

      - name: Build signed IPA
        run: |
          mkdir -p "$BUILD_WORKING_DIR"
          cd "$SOURCE_PATH/ci"
          fastlane master_build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wraithgram.ipa
          path: ${{ env.BUILD_WORKING_DIR }}/artifacts/Telegram.ipa
          if-no-files-found: error
