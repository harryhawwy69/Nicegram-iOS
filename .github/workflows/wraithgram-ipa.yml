name: Wraithgram Unsigned IPA

on:
  push:
    branches:
      - feat/lean-ios-client
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wraithgram-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      BAZEL_LOCAL_CACHE: /Users/runner/work/wraithgram-bazel-cache
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_wraithgram
      BUILD_WORKING_DIR: /Users/wraithgram/build-working-dir
      BUNDLE_ID: app.wraithgram
      SOURCE_PATH: /Users/wraithgram/source
      WRAITHGRAM_TELEGRAM_CONFIGURATION_PROD: ${{ secrets.WRAITHGRAM_TELEGRAM_CONFIGURATION_PROD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Restore Bazel caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BAZEL_LOCAL_CACHE }}
            ${{ env.BAZEL_USER_ROOT }}/cache
          key: ${{ runner.os }}-${{ runner.arch }}-wraithgram-bazel-${{ hashFiles('versions.json', 'MODULE.bazel', 'Package.resolved', 'ci/nicegram.bazelrc', 'ci/fastlane/Fastfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-wraithgram-bazel-

      - name: Validate private source and runtime inputs
        env:
          WRAITHGRAM_BITBUCKET_SSH_KEY: ${{ secrets.WRAITHGRAM_BITBUCKET_SSH_KEY }}
        run: |
          missing=0
          for name in \
            WRAITHGRAM_BITBUCKET_SSH_KEY \
            WRAITHGRAM_TELEGRAM_CONFIGURATION_PROD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is required to build a Wraithgram IPA."
              missing=1
            fi
          done
          exit "$missing"

      - name: Initialize source submodules
        env:
          WRAITHGRAM_BITBUCKET_SSH_KEY: ${{ secrets.WRAITHGRAM_BITBUCKET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$WRAITHGRAM_BITBUCKET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts
          git submodule update --init --recursive --depth 1

      - name: Select required Xcode
        run: |
          xcode_version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          sudo mkdir -p /Users/wraithgram
          sudo chown -R "$(whoami)" /Users/wraithgram
          rm -rf "$SOURCE_PATH"
          cp -R "$GITHUB_WORKSPACE" "$SOURCE_PATH"

      - name: Build unsigned IPA
        run: |
          xcode_path="$(xcode-select -p)"
          sudo ln -sfn "${xcode_path%/Contents/Developer}" /Applications/Xcode.app
          chmod +x "$SOURCE_PATH/ci/build-unsigned-ipa.sh" "$SOURCE_PATH/ci/strip-ipa-signatures.sh"
          "$SOURCE_PATH/ci/build-unsigned-ipa.sh"
          "$SOURCE_PATH/ci/strip-ipa-signatures.sh" \
            "$BUILD_WORKING_DIR/artifacts/Telegram.ipa" \
            "$BUILD_WORKING_DIR/artifacts/Wraithgram-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wraithgram-unsigned.ipa
          path: ${{ env.BUILD_WORKING_DIR }}/artifacts/Wraithgram-unsigned.ipa
          if-no-files-found: error
